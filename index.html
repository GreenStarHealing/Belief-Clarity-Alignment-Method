<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Alignment Method®</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#1a7070; --teal-mid:#3aacac; --teal-pale:rgba(58,172,172,0.12);
    --gold:#c8a84a; --gold-light:#dfc068; --gold-pale:rgba(200,168,74,0.10);
    --near-black:#080f0f; --dark-bg:#0b1515;
    --panel:rgba(255,255,255,0.055); --panel2:rgba(255,255,255,0.028);
    --border:rgba(200,168,74,0.20); --border-teal:rgba(58,172,172,0.18);
    --border-soft:rgba(255,255,255,0.08);
    --text:#f0ebe2; --text-soft:#bfb8a8; --text-muted:#7a7060;
    --serif:'Cormorant Garamond',serif; --sans:'Raleway',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);color:var(--text);background:var(--dark-bg);min-height:100vh;font-size:14px;line-height:1.85}

  .topbar{position:sticky;top:0;z-index:20;background:rgba(11,21,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:14px;padding:10px 18px}
  .brand{font-family:var(--serif);font-weight:600;color:var(--gold);font-size:17px}
  .who{font-size:12px;color:var(--text-muted);margin-left:auto}
  .who b{color:var(--gold)}
  .topbtn{border:1px solid var(--border);background:transparent;color:var(--text-soft);border-radius:999px;padding:7px 14px;font-size:11px;font-weight:500;cursor:pointer;font-family:var(--sans);letter-spacing:0.04em;transition:all 0.2s}
  .topbtn:hover{border-color:var(--gold);color:var(--gold)}

  .stage{max-width:640px;margin:0 auto;padding:34px 18px 90px;text-align:center}
  .kicker{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--teal-mid);font-weight:600;margin-bottom:8px}
  h1{font-family:var(--serif);font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.1;color:var(--text);margin:0 0 8px}
  h1 em{font-style:italic;color:var(--gold)}
  .lede{font-size:14px;color:var(--text-soft);line-height:1.85;margin:0 auto 8px;max-width:33em}
  .meta{font-size:11px;color:var(--teal-mid);letter-spacing:1.5px;text-transform:uppercase;margin:12px 0}
  .meta span{margin:0 8px}
  .note{background:rgba(26,112,112,0.10);border:1px solid var(--border-teal);border-radius:14px;padding:13px 17px;margin:15px auto;max-width:34em;text-align:left;font-size:13.5px;line-height:1.65;color:var(--text-soft)}
  .note .nk{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal-mid);font-weight:600;display:block;text-align:center;margin-bottom:6px}
  .note em{color:var(--text-muted)}
  .helper{font-size:12.5px;color:var(--text-muted);max-width:34em;margin:6px auto;line-height:1.65}
  .recap{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:11px 15px;margin:0 auto 14px;max-width:34em;text-align:left}
  .recap .rk{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal-mid);font-weight:600;text-align:center;margin-bottom:5px}
  .recap .ri{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--text);padding:3px 0}
  .recap .ri.cur{color:var(--gold);font-weight:600} .recap .ri.done{opacity:.45}

  textarea,input[type=text]{width:100%;max-width:34em;border:1px solid var(--border-soft);background:rgba(5,18,18,0.5);border-radius:12px;
    padding:13px 15px;font-size:14px;font-family:var(--sans);color:var(--text);resize:none;min-height:52px;display:block;margin:6px auto 4px}
  input[type=text]{min-height:auto}
  textarea:focus,input:focus{outline:none;border-color:var(--teal-mid);background:rgba(5,18,18,0.7)}
  textarea::placeholder,input::placeholder{color:var(--text-muted)}
  .rowline{display:flex;gap:8px;max-width:34em;margin:8px auto;align-items:flex-start}
  .rowline textarea{margin:0;flex:1}
  .rmv{border:none;background:none;color:var(--text-muted);cursor:pointer;font-size:20px;line-height:1;padding:10px 4px;transition:color 0.2s}
  .rmv:hover{color:var(--gold)}
  .addbtn{background:none;border:1px dashed var(--border);color:var(--gold);border-radius:999px;padding:8px 16px;font-size:12px;cursor:pointer;margin:6px auto;font-family:var(--sans);letter-spacing:0.04em;transition:all 0.2s}
  .addbtn:hover{border-color:var(--gold)}

  .btn{display:block;width:100%;max-width:34em;margin:16px auto 8px;border:none;border-radius:999px;
    background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--near-black);
    font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:15px;cursor:pointer;transition:all .2s;font-family:var(--sans)}
  .btn:hover{filter:brightness(1.1)} .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn.teal{background:linear-gradient(135deg,var(--teal),var(--teal-mid));color:var(--text)}
  .btn.ghost{background:none;color:var(--text-soft);border:1px solid var(--border);font-weight:500;font-size:11px;padding:10px;max-width:18em;text-transform:uppercase;letter-spacing:0.08em}
  .btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
  .back{background:none;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;margin:6px auto;display:block;font-family:var(--sans);transition:color 0.2s}
  .back:hover{color:var(--text-soft)}

  .pill{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:17px 21px;margin:15px auto;max-width:34em;text-align:left}
  .pill .lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px}
  .pill .big{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.4;color:var(--text)}

  .cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:8px auto;max-width:34em}
  .mcard{flex:1;min-width:220px;border:1px solid var(--border);border-radius:24px;background:var(--panel);padding:18px;text-align:left;cursor:pointer;transition:all .2s}
  .mcard:hover{border-color:var(--gold);transform:translateY(-2px)}
  .mcard.ns{background:linear-gradient(135deg,rgba(26,112,112,0.16),rgba(200,168,74,0.06));border-color:var(--border-teal)}
  .mcard h3{font-family:var(--serif);font-size:19px;margin:2px 0 6px;color:var(--text)}
  .mcard p{font-size:12.5px;line-height:1.65;color:var(--text-soft);margin:0 0 10px}
  .status{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;color:var(--teal-mid)}
  .status.done{color:var(--gold)}
  .mcard .cbtn{margin-top:8px;font-size:12px;font-weight:600;color:var(--gold)}

  .choicebox{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:15px;margin:12px auto;max-width:34em;text-align:left}
  .choicebox .ck{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;color:var(--teal-mid)}
  .choicebox .ct{font-size:14px;line-height:1.65;margin-top:6px;color:var(--text-soft)}
  .orr{font-family:var(--serif);font-style:italic;color:var(--text-muted);margin:8px}
  .bcard{border:1px solid var(--border);border-radius:22px;background:var(--panel);padding:15px;margin:13px auto;max-width:36em;text-align:center}
  .bcap{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600;color:var(--teal-mid)}
  .bname{font-family:var(--serif);font-size:15px;color:var(--text);margin:6px 0 8px}
  .arrowd{color:var(--gold);font-size:16px}
  .chlbl{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600;color:var(--gold);margin-top:4px}
  .confirm{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--near-black);border:none;border-radius:999px;padding:10px 16px;font-size:11px;font-weight:600;cursor:pointer;margin-top:9px;width:100%;font-family:var(--sans);letter-spacing:0.08em;text-transform:uppercase;transition:all 0.2s}
  .confirm.done{background:var(--panel);color:var(--gold);border:1px solid var(--border)}
  .qlil{font-family:var(--serif);font-style:italic;color:var(--text-muted);font-size:13px;margin-top:10px}
  .heart{font-size:32px}
  .hero-img{width:100%;max-width:34em;border-radius:22px;border:1px solid var(--border);margin:0 auto 10px;display:block;object-fit:cover}

  .scriptbox{background:linear-gradient(135deg,rgba(26,112,112,0.16),rgba(200,168,74,0.06));border:1px solid var(--border-teal);border-radius:22px;padding:20px 22px;margin:15px auto;max-width:36em;text-align:left}
  .scriptbox p{font-family:var(--serif);font-style:italic;font-size:13.5px;line-height:1.55;margin:0 0 10px;color:var(--text)}
  .scriptbox p:last-child{margin-bottom:0;color:var(--gold)}
  .scriptbox .lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px}
  .timer{font-family:var(--serif);font-size:40px;color:var(--gold);margin:6px}
  .chip{display:inline-block;border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:7px 14px;margin:4px;font-size:12px;cursor:pointer;color:var(--text-soft);font-family:var(--sans);transition:all 0.2s}
  .chip:hover{border-color:var(--gold);color:var(--gold)} .chip.sel{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--near-black);border-color:var(--gold);font-weight:600}
  .thoughtcard{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:13px;margin:10px auto;max-width:34em;text-align:left}
  .thoughtcard .tq{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--text);margin-bottom:8px}
  .caprow{display:flex;justify-content:space-between;align-items:center;max-width:34em;margin:6px auto;font-size:12px;color:var(--text-muted)}

  .sumhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:6px;text-align:left;flex-wrap:wrap;gap:8px}
  .sumhead .st{font-family:var(--serif);font-size:24px;color:var(--text)}
  .sumhead .sd{font-size:12px;color:var(--text-muted)}
  .sumsec{text-align:left;margin:22px 0}
  .sumsec>.sh{font-family:var(--serif);font-size:18px;color:var(--text);border-left:3px solid var(--gold);padding-left:10px;margin-bottom:10px}
  .sumsec.nsx>.sh{color:var(--teal-mid)}
  .seclabel{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--teal-mid);font-weight:600;margin:14px 0 8px;text-align:left}
  .group{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:6px;margin-bottom:12px}
  .gitem{border-left:3px solid var(--gold);padding:6px 12px 10px;margin:6px}
  .gitem+.gitem{border-top:1px solid rgba(200,168,74,0.10);padding-top:10px}
  .gcap{text-align:center;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold);font-weight:600;margin:4px 0}
  .gname{text-align:center;font-family:var(--serif);font-size:14px;color:var(--text);margin-bottom:8px}
  .gpair{display:flex;gap:8px;align-items:stretch}
  .gcell{flex:1;border-radius:12px;padding:8px 11px}
  .gcell.gc{background:rgba(26,112,112,0.10);border:1px solid var(--border-teal)} .gcell.gh{background:var(--gold-pale);border:1px solid var(--border)}
  .gpair .ga{align-self:center;color:var(--gold)}
  .gmini{font-size:8.5px;letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-bottom:4px}
  .gc .gmini{color:var(--teal-mid)} .gh .gmini{color:var(--gold)}
  .gtxt{font-size:11.5px;line-height:1.4;font-style:italic;color:var(--text-soft)}
  .guide{background:var(--panel);border:1px solid var(--border);border-radius:14px;text-align:center;padding:12px;margin-top:6px}
  .guide .gnum{font-family:var(--serif);font-size:30px;color:var(--gold);font-weight:600}
  .guide .gest{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-muted)}
  .sscript{background:linear-gradient(135deg,rgba(26,112,112,0.16),rgba(200,168,74,0.06));border:1px solid var(--border-teal);border-radius:14px;padding:16px 18px}
  .sscript p{font-family:var(--serif);font-style:italic;font-size:12.5px;line-height:1.55;margin:0 0 8px;color:var(--text)}
  .sscript p:last-child{margin-bottom:0;color:var(--gold)}
  .chain{border:1px solid var(--border);border-radius:14px;background:var(--panel);overflow:hidden}
  .crow{display:flex;border-bottom:1px solid rgba(200,168,74,0.10)}
  .crow:last-child{border-bottom:none}
  .crow .cthought{flex:1.5;padding:9px 12px;font-style:italic;font-size:12px;color:var(--text)}
  .crow .cfeel{flex:.9;padding:9px 12px;background:var(--panel2);font-weight:600;color:var(--gold);font-size:12px}
  .contactbar{text-align:left;border-top:1px dashed var(--border);margin-top:20px;padding-top:12px;font-size:12.5px;color:var(--text-soft)}
  .contactbar b{color:var(--gold)}
  .deeperbox{background:linear-gradient(160deg,rgba(26,112,112,0.10),rgba(0,0,0,0.10));border:1px solid var(--border);border-radius:24px;padding:28px 26px;margin:22px auto 0;max-width:34em;text-align:center}
  .deeperbox h2{font-family:var(--serif);font-weight:600;font-size:22px;color:var(--text);margin:0 0 10px}
  .deeperbox p{font-size:13.5px;color:var(--text-soft);line-height:1.75;margin:0 0 18px}
  .deeperbox a.btn{text-decoration:none;max-width:26em}
  .deeperbox .upgrade{font-size:12px;color:var(--text-muted);margin-top:14px}
  .deeperbox .upgrade a{color:var(--gold)}
  .editable{border:1px dashed transparent;border-radius:6px;padding:1px 3px}
  .editable:hover{border-color:var(--border)}
  .footer-note{max-width:34em;margin:16px auto 0;font-size:11px;color:var(--text-muted);text-align:center}
  .pagefooter{border-top:1px solid var(--border-soft);margin-top:30px;padding-top:22px;text-align:center}
  .pagefooter img{width:44px;height:44px;border-radius:50%;display:block;margin:0 auto 10px}
  .pagefooter .copy{font-family:var(--serif);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted)}

  /* divider */
  .divider{display:flex;align-items:center;gap:12px;margin:18px auto;max-width:34em}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(to right,transparent,var(--border),transparent)}
  .divider-stars{color:var(--gold);font-size:13px;letter-spacing:6px}

  @page{ margin:12mm; }
  @media print{
    .topbar,.btn,.back,.addbtn,.no-print,.hero-img{display:none !important}
    body{background:#fff;color:#222}
    .stage{max-width:none;padding:0}
    .sumsec + .sumsec{ break-before:page; }
    .sumsec{ break-inside:auto; }
    .sumsec>.sh{ break-after:avoid; }
    .gitem,.guide,.thoughtcard,.crow,.pill,.note,.contactbar,.sscript{ break-inside:avoid; }
    .sumhead{ margin-bottom:4px; }
    .sumsec{ margin:12px 0; }
    .seclabel{ margin:9px 0 6px; }
    .group{ margin-bottom:8px; background:#fff; border:1px solid #ddd; }
    .gitem{ padding:5px 12px 9px; }
    .gitem+.gitem{ padding-top:9px; }
    .guide{ padding:9px; margin-top:5px; background:#fff; border:1px solid #ddd; }
    .pill{ padding:13px 18px; margin:10px 0; background:#f8f6f0; border:1px solid #ddd; }
    .pill .lbl{color:#1a7070} .pill .big{color:#222}
    .note{ margin:10px 0; background:#f0f8f8; border:1px solid #cce0e0; }
    .sscript{ padding:14px 16px; background:#f0f8f8; border:1px solid #cce0e0; }
    .sscript p{ margin-bottom:7px; color:#222; }
    .sscript p:last-child{color:#1a7070}
    .chain{ background:#fff; border:1px solid #ddd; }
    .crow .cthought{color:#222} .crow .cfeel{color:#1a7070;background:#f8f6f0}
    .contactbar{color:#444} .contactbar b{color:#1a7070}
    .sumhead .st{color:#222} .sumsec>.sh{color:#222}
    .gcell.gc{background:#f0f8f8;border-color:#cce0e0} .gcell.gh{background:#faf6ee;border-color:#e0d8c0}
    .gc .gmini{color:#1a7070} .gh .gmini{color:#8a7030}
    .gtxt{color:#333} .gcap{color:#8a7030} .gname{color:#222}
    .guide .gnum{color:#1a7070} .seclabel{color:#1a7070}
  }
  @media(max-width:520px){
    .mcard{min-width:100%}
    .pill,.bcard,.choicebox{padding:14px}
  }
</style>
</head>
<body>
  <div class="topbar no-print">
    <div class="brand">Belief Alchemy Collective</div>
    <button class="topbtn" id="homeBtn">Menu</button>
    <button class="topbtn" id="sumBtn">Summary &amp; PDF</button>
    <div class="who" id="whoLabel"></div>
  </div>
  <div class="stage" id="app"></div>
  <div class="footer-note no-print" id="foot"></div>

<script>

  var blank=function(){ return {
    client:{name:"",date:""},
    contact:"info@greenstarhealing.com",
    align:{done:false,goal:"",payoffs:[""],actions:[""],benefit:{},chosen:{},confirmed:{},finalAnswer:""}
  };};
  var S=blank();
  try{var raw=localStorage.getItem('bac_alignment_tool'); if(raw){ S=Object.assign(blank(),JSON.parse(raw)); }}catch(e){}
  function save(){ try{localStorage.setItem('bac_alignment_tool',JSON.stringify(S));}catch(e){} }

  var app=document.getElementById('app');
  var current='home', history=[];
  function go(s,noPush){ if(!noPush) history.push(current); current=s; render(); window.scrollTo(0,0); }
  function back(){ if(history.length){ current=history.pop(); render(); window.scrollTo(0,0);} else go('home',true); }

  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function el(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;}
  function cn(){ return S.client.name? S.client.name : 'Lovely'; }
  function aItems(){ var o=[]; S.align.payoffs.filter(t=>t.trim()).forEach(t=>o.push({type:'benefit',text:t.trim()})); S.align.actions.filter(t=>t.trim()).forEach(t=>o.push({type:'action',text:t.trim()})); return o; }
  function todayStr(){ try{ var d=new Date(); return d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}); }catch(e){ return ''; } }

  /* ---------- HOME ---------- */
  function screenHome(){
    var aS = S.align.done?'Complete':(S.align.goal?'In progress':'Not started');
    return '<div class="kicker">Belief Alchemy Collective</div>'+
    '<img class="hero-img" src="'+HERO_IMG+'" alt="Belief Alchemy Collective">'+
    '<h1>The Alignment Method®</h1>'+
    '<p class="lede">Uncover the subconscious beliefs that are stopping you, and discover the beliefs you need instead. Your answers stay private in this browser and nothing is sent anywhere.</p>'+
    '<input type="text" id="clientName" placeholder="Your first name" value="'+esc(S.client.name)+'">'+
    '<div class="cards">'+
      '<div class="mcard" data-start="align"><div class="status'+(S.align.done?' done':'')+'">'+aS+'</div><h3>The Alignment Method®</h3><p>Uncover the subconscious beliefs that are stopping you, and discover the beliefs you need instead.</p><div class="cbtn">'+(S.align.goal?'Continue':'Start')+' &rarr;</div></div>'+
    '</div>'+
    '<button class="btn" data-go="summary">View summary &amp; save PDF &rarr;</button>'+
    '<button class="btn ghost" data-go="manage">Import or export</button>'+
    '<button class="btn ghost" data-reset>Start fresh</button>'+
    '<div class="pagefooter no-print"><img src="'+SITE_LOGO+'" alt="Green Star Healing"><div class="copy">&copy; Green Star Healing &middot; Belief Alchemy Collective</div></div>';
  }

  /* ---------- MANAGE (import / export / clear) ---------- */
  function manage(){
    return '<div class="kicker">Your file</div><h1>Import or export</h1>'+
    '<p class="lede">Save your work to keep or share, or load a previous session. Everything stays on this device.</p>'+
    '<div id="msg" class="note" style="display:none"></div>'+
    '<div class="choicebox"><div class="ck">Export</div><div class="ct" style="margin-bottom:8px">Save or copy the current session (<b>'+esc(S.client.name||'unnamed')+'</b>).</div>'+
      '<button class="btn" data-copy-doc style="margin:6px auto">Copy for Google Doc</button>'+
      '<button class="btn ghost" data-download style="margin:6px auto">Download backup file (.json)</button>'+
      '<button class="btn ghost" data-copy-code style="margin:6px auto">Copy backup code</button>'+
    '</div>'+
    '<div class="choicebox"><div class="ck">Import</div><div class="ct" style="margin-bottom:8px">Load a session from a saved file, or paste the backup code (or the whole Google Doc you exported).</div>'+
      '<label class="btn ghost" style="margin:6px auto;cursor:pointer">Choose a .json backup file<input type="file" id="fileIn" accept=".json,application/json,.txt,text/plain" style="display:none"></label>'+
      '<textarea id="pasteIn" placeholder="\u2026or paste the backup code / exported doc text here"></textarea>'+
      '<button class="btn" data-load-paste style="margin:6px auto">Load this session</button>'+
    '</div>'+
    '<div class="choicebox"><div class="ck">Clear</div><div class="ct" style="margin-bottom:8px">Wipe everything and start fresh.</div>'+
      '<button class="btn ghost" data-reset style="margin:6px auto">Start fresh</button>'+
    '</div>'+
    backBtn();
  }
  function toast(t,ok){ var m=document.getElementById('msg'); if(!m) return; m.style.display='block'; m.innerHTML=(ok===false?'\u26a0 ':'\u2713 ')+esc(t); m.style.borderColor=(ok===false?'rgba(180,80,70,0.3)':'rgba(58,172,172,0.3)'); }

  /* ---------- ALIGNMENT METHOD ---------- */
  function aWant(){ return '<div class="kicker">The Alignment Method® \u00b7 Step 1</div><h1>What do you <em>want?</em></h1><p class="lede">Choose one thing (for now) \u2014 a goal, a feeling, an amount of money, good health, a relationship\u2026 anything.</p><div class="note"><span class="nk">How to answer</span>The thing you have been trying to achieve the most is a great place to start.</div><textarea id="goal" placeholder="I want\u2026">'+esc(S.align.goal)+'</textarea><button class="btn" data-save="goal" data-go="aPayoffs">Continue &rarr;</button>'+backBtn(); }
  function aPayoffs(){ return '<div class="kicker">The Alignment Method® \u00b7 Step 2</div><h1>What\u2019s the <em>benefit</em> of achieving this goal?</h1><p class="lede">When you get what you want, what would that mean to you?</p><div class="note"><span class="nk">For example</span>If you want your dream house \u2014 what would that mean? <em>Stability, safety?</em> If you got more money \u2014 <em>More holidays? Family time?</em></div>'+listEditor('align','payoffs','A benefit \u2026 e.g. freedom')+'<p class="helper">List everything. One thing per line.</p><button class="btn" data-collect="align:payoffs" data-go="aActions">Continue &rarr;</button>'+backBtn(); }
  function aActions(){ return '<div class="kicker">The Alignment Method® \u00b7 Step 3</div><h1>What <em>actions</em> do you <em>KNOW</em> you need to take?</h1><p class="lede">The things you already know you need to do. List them as they come.</p><div class="note"><span class="nk">For example</span>Real, doable actions only. Not \u201cbelieve in myself\u201d \u2014 things you could do tomorrow. e.g. <em>book the class, send the application, ask for the raise, post the offer.</em></div>'+listEditor('align','actions','An action \u2026 e.g. book the class')+'<button class="btn" data-collect="align:actions" data-go="aNotice">Continue &rarr;</button>'+backBtn(); }
  function aNotice(){ var p=S.align.payoffs.filter(t=>t.trim()),a=S.align.actions.filter(t=>t.trim());
    return '<div class="kicker">The Alignment Method® \u00b7 Step 4</div><h1>You know you are <em>able</em> to take those actions\u2026</h1><p class="lede">Have you ever wondered why you don\u2019t just do what you need to, even though you know that you can?</p>'+
    '<div class="recap"><div class="rk">The benefits</div>'+p.map(t=>'<div class="ri">'+esc(t)+'</div>').join('')+'</div>'+
    '<div class="recap"><div class="rk">What you said you need to do</div>'+a.map(t=>'<div class="ri">'+esc(t)+'</div>').join('')+'</div>'+
    '<p class="helper">Are you starting to understand that maybe there is something subconsciously stopping you?</p>'+
    '<button class="btn" data-belief>I am ready to find out why &rarr;</button>'+backBtn(); }

  function backBtn(){ return '<button class="back" data-back>&larr; Back</button>'; }
  function listEditor(flow,field,ph){
    var arr=S[flow][field].length?S[flow][field]:[""];
    var rows=arr.map(function(v,i){ return '<div class="rowline"><textarea data-list="'+flow+':'+field+'" data-idx="'+i+'" placeholder="'+ph+'">'+esc(v)+'</textarea>'+(arr.length>1?'<button class="rmv" data-rmv="'+flow+':'+field+'" data-idx="'+i+'">\u00d7</button>':'')+'</div>'; }).join('');
    return '<div>'+rows+'</div><button class="addbtn" data-add="'+flow+':'+field+'">+ Add another</button>';
  }

  function startBeliefs(){ S.align.dividerShown=false; askBenefit(0); }
  function askBenefit(idx){ var its=aItems(); if(idx>=its.length){ go('aRevealed'); return; } var it=its[idx]; if(it.type==='action'&&!S.align.dividerShown){ S.align.dividerShown=true; renderDivider(idx); return;} renderBenefit(idx); }
  function renderDivider(idx){ app.innerHTML=''; app.appendChild(el('<div><div class="kicker">The Alignment Method® \u00b7 Step 5</div><div class="heart">\u2764</div><h1>Now the same with your <em>actions</em>, '+esc(cn())+'.</h1><p class="lede">For each action \u2014 ask, with your hand on your heart, how does <em>not</em> taking it secretly keep you safe?</p><button class="btn" id="dn">Continue &rarr;</button></div>')); document.getElementById('dn').onclick=function(){ renderBenefit(idx); }; }
  function renderBenefit(idx){
    var its=aItems(),it=its[idx],key=it.type+'::'+it.text,total=its.length;
    var arr=it.type==='benefit'?S.align.payoffs.filter(t=>t.trim()):S.align.actions.filter(t=>t.trim());
    var done={}; for(var j=0;j<idx;j++){ if(its[j].type===it.type) done[its[j].text]=1; }
    var recap='<div class="recap"><div class="rk">Your '+it.type+'s</div>'+arr.map(function(t){var cls=t.trim()===it.text?'ri cur':(done[t.trim()]?'ri done':'ri');return '<div class="'+cls+'">'+(t.trim()===it.text?'&rarr; ':'')+esc(t)+'</div>';}).join('')+'</div>';
    var heading=it.type==='benefit'?'What\u2019s the benefit of <em>not</em> having this?':'What\u2019s the benefit of <em>not</em> doing this?';
    var body=it.type==='benefit'?'There is always a subconscious benefit to not having what you \u2018think\u2019 you want. It always links to safety \u2014 from being seen, judged, hurt, or losing what you\u2019ve got.':'You <em>KNOW</em> you could realistically do this. So why aren\u2019t you? There\u2019s always a subconscious benefit, and it always links to safety.';
    var lab=it.type==='benefit'?'Not having\u2026':'Not doing\u2026';
    app.innerHTML='';
    app.appendChild(el('<div><div class="kicker">The Alignment Method® \u00b7 Question '+(idx+1)+' of '+total+'</div>'+recap+'<h1>'+heading+'</h1><div class="note"><span class="nk">'+lab+'</span><div style="text-align:center;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--gold)">'+esc(it.text)+'</div></div><p class="helper">'+body+'</p><p class="helper"><b>Go with the first thing</b> your brain tells you, even if it doesn\u2019t make sense.</p><textarea id="ba" placeholder="A sentence is plenty. Use your own words.">'+esc(S.align.benefit[key]||'')+'</textarea><button class="btn" id="bn">Next &rarr;</button><button class="back" id="bb">&larr; Back</button></div>'));
    var ta=document.getElementById('ba');
    document.getElementById('bn').onclick=function(){ S.align.benefit[key]=ta.value.trim(); save(); askBenefit(idx+1); };
    document.getElementById('bb').onclick=function(){ S.align.benefit[key]=ta.value; save(); if(idx===0){ current='aNotice'; render(); } else { if(its[idx].type==='action'&&its[idx-1].type==='benefit') S.align.dividerShown=false; askBenefit(idx-1);} };
  }
  function aRevealed(){
    var its=aItems();
    var cards=its.map(function(it){var key=it.type+'::'+it.text;return '<div class="choicebox"><div style="text-align:center;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--text)">&ldquo;'+esc(S.align.benefit[key]||'')+'&rdquo;</div><div style="text-align:center;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:7px">From the '+it.type+' \u00b7 <span style="color:var(--text-muted)">'+esc(it.text)+'</span></div></div>';}).join('');
    return '<div class="kicker">The Alignment Method® \u00b7 Step 6</div><h1>This is what you really <em>believe</em> will happen if you get what you want.</h1><div class="pill"><div class="lbl">What you said you want</div><div class="big">'+esc(S.align.goal)+'</div></div>'+cards+'<p class="lede"><em>'+esc(cn())+'</em>, doesn\u2019t it make sense why this hasn\u2019t happened <em>yet?</em></p><p class="helper">Debbie will help you transform what you actually believe into what you <em>need</em> to believe to be in alignment.</p><button class="btn" data-go="aChoose">Yes &rarr;</button>'+backBtn();
  }
  function aChoose(){
    var its=aItems();
    var cards=its.map(function(it){var key=it.type+'::'+it.text,done=S.align.confirmed[key];return '<div class="bcard"><div class="bcap">Current belief</div><div class="bname">&ldquo;'+esc(S.align.benefit[key]||'')+'&rdquo;</div><div class="arrowd">&darr;</div><div class="chlbl">Your chosen belief</div><textarea data-chosen="'+esc(key)+'" placeholder="In your own words.">'+esc(S.align.chosen[key]||'')+'</textarea><div class="qlil">Would this move you toward what you want?</div><button class="confirm'+(done?' done':'')+'" data-confirm="'+esc(key)+'">'+(done?'\u2713 Confirmed':'Yes \u2014 this would move me toward what I want')+'</button></div>';}).join('');
    return '<div class="kicker">The Alignment Method® \u00b7 Step 6</div><h1>What do you need to <em>believe</em> instead?</h1><p class="lede">For each belief running underneath, write the opposite \u2014 the belief you\u2019d need to have instead.</p>'+cards+'<div class="note"><span class="nk">One last thing</span>If you had those chosen beliefs, what would you do differently? How would you show up? And would you receive what you want?</div><textarea id="fa" placeholder="A few lines is plenty.">'+esc(S.align.finalAnswer)+'</textarea><button class="btn" data-build>See the full picture &rarr;</button>'+backBtn();
  }

  /* ---------- SUMMARY ---------- */
  function summary(){
    var out='<div class="no-print" style="text-align:center"><button class="btn" onclick="window.print()">Save as PDF (print)</button><button class="btn ghost" data-go="home">Back to menu</button></div>';
    out+='<div class="sumhead"><div><div class="seclabel" style="margin:0">Belief Clarity Summary</div><div class="st">'+esc(S.client.name||'Client')+'</div></div><div class="sd">'+esc(S.client.date||todayStr())+'</div></div>';
    var any=false;
    if(S.align.goal){ any=true; out+=alignSummary(); }
    if(!any){ out+='<p class="lede" style="margin-top:20px">Nothing captured yet. Complete The Alignment Method® from the menu, then come back here to save the PDF.</p>'; }
    else { out+='<div class="contactbar">Your next step, '+esc(cn())+': reach out to Debbie to take this further. <b class="editable" contenteditable="true" data-edit="contact">'+esc(S.contact)+'</b><br>OR book a FREE 30-minute Belief Clarity Call with Debbie: <b><a href="https://calendly.com/greenstarhealing-info/30-minute-belief-clarity-call-with-debbie" target="_blank" rel="noopener" style="color:var(--gold)">Book here</a></b></div>'; }
    if(any){ out+='<div class="deeperbox no-print"><h2>Ready to go deeper?</h2><p>Most likely, you have started to see your patterns emerging. But if awareness alone was enough, this pattern would already be gone. This is exactly where most people stay stuck. Inside the Belief Alchemy Collective, we do not just identify the belief, we recode it at the subconscious level so that your behaviour actually changes.</p><a class="btn" href="https://www.skool.com/mooncoding-5748/about" target="_blank" rel="noopener">Join the Belief Alchemy Collective</a><div class="upgrade">Already a member and wish to upgrade to Premium? <a href="https://www.skool.com/mooncoding-5748/plans" target="_blank" rel="noopener">Belief Alchemy Collective</a></div></div>'; }
    return out;
  }
  function alignSummary(){
    var payoffs=S.align.payoffs.filter(t=>t.trim()),actions=S.align.actions.filter(t=>t.trim());
    function grp(label,arr,type){ if(!arr.length) return ''; return '<div class="seclabel">'+label+'</div><div class="group">'+arr.map(function(t){var key=type+'::'+t.trim();return '<div class="gitem"><div class="gcap">'+type+'</div><div class="gname">'+esc(t)+'</div><div class="gpair"><div class="gcell gc"><div class="gmini">Current belief</div><div class="gtxt">&ldquo;'+esc(S.align.benefit[key]||'\u2014')+'&rdquo;</div></div><div class="ga">&rarr;</div><div class="gcell gh"><div class="gmini">Chosen belief</div><div class="gtxt">&ldquo;'+esc(S.align.chosen[key]||'\u2014')+'&rdquo;</div></div></div></div>';}).join('')+'</div>'; }
    return '<div class="sumsec"><div class="sh">The Alignment Method®</div>'+
      '<div class="pill"><div class="lbl">What you want</div><div class="big">'+esc(S.align.goal)+'</div></div>'+
      grp('Benefits and the beliefs underneath',payoffs,'benefit')+
      grp('Actions and the beliefs underneath',actions,'action')+
      (S.align.finalAnswer?'<div class="note" style="margin-top:12px"><span class="nk">If those beliefs were true</span>'+esc(S.align.finalAnswer)+'</div>':'')+
    '</div>';
  }

  /* ---------- ROUTER ---------- */
  var map={ home:screenHome, aWant:aWant, aPayoffs:aPayoffs, aActions:aActions, aNotice:aNotice, aRevealed:aRevealed, aChoose:aChoose, summary:summary, manage:manage };

  /* ---------- export / import helpers ---------- */
  function exportDocText(){
    var L=[];
    L.push('BELIEF CLARITY SUMMARY \u2014 THE ALIGNMENT METHOD\u00ae');
    L.push('Client: '+(S.client.name||'\u2014'));
    L.push('Date: '+(S.client.date||todayStr()));
    L.push('');
    if(S.align.goal){
      L.push('== THE ALIGNMENT METHOD\u00ae ==');
      L.push('What you want: '+S.align.goal);
      L.push('');
      var pf=S.align.payoffs.filter(t=>t.trim()), ac=S.align.actions.filter(t=>t.trim());
      if(pf.length){ L.push('Benefits and the beliefs underneath:'); pf.forEach(function(t){ var k='benefit::'+t.trim(); L.push('  \u2022 '+t.trim()); L.push('      Current belief: "'+(S.align.benefit[k]||'')+'"'); L.push('      Chosen belief:  "'+(S.align.chosen[k]||'')+'"'); }); L.push(''); }
      if(ac.length){ L.push('Actions and the beliefs underneath:'); ac.forEach(function(t){ var k='action::'+t.trim(); L.push('  \u2022 '+t.trim()); L.push('      Current belief: "'+(S.align.benefit[k]||'')+'"'); L.push('      Chosen belief:  "'+(S.align.chosen[k]||'')+'"'); }); L.push(''); }
      if(S.align.finalAnswer){ L.push('If those beliefs were true: '+S.align.finalAnswer); }
      L.push('');
    }
    L.push('Your next step, '+(S.client.name||'Lovely')+': reach out to Debbie to take this further.');
    L.push(S.contact||'');
    L.push('');
    L.push('=== SESSION DATA (for re-importing \u2014 leave this untouched) ===');
    L.push('\u27e6BC\u27e7'+JSON.stringify(S)+'\u27e6/BC\u27e7');
    return L.join('\n');
  }
  function downloadFile(name,text,mime){
    try{ var blob=new Blob([text],{type:mime||'text/plain'}); var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },100); return true;
    }catch(e){ return false; }
  }
  function copyText(text,cb){
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){cb(true);},function(){ fallbackCopy(text,cb); }); }
    else fallbackCopy(text,cb);
  }
  function fallbackCopy(text,cb){ try{ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); var ok=document.execCommand('copy'); document.body.removeChild(ta); cb(ok); }catch(e){ cb(false); } }
  function extractState(str){
    if(!str) return null;
    var s=String(str);
    var m=s.match(/\u27e6BC\u27e7([\s\S]*?)\u27e6\/BC\u27e7/);
    var json = m? m[1] : null;
    if(!json){ var a=s.indexOf('{'), b=s.lastIndexOf('}'); if(a!==-1&&b>a) json=s.slice(a,b+1); }
    if(!json) return null;
    try{ var o=JSON.parse(json); if(o && (o.align||o.client)) return o; }catch(e){}
    return null;
  }
  function loadState(o){ S=Object.assign(blank(),o); if(!S.client.date) S.client.date=todayStr(); save(); history=[]; go('home',true); }
  function render(){
    app.innerHTML=''; app.appendChild(el('<div>'+map[current]()+'</div>'));
    document.getElementById('whoLabel').innerHTML = S.client.name? 'Client: <b>'+esc(S.client.name)+'</b>' : '';
    document.getElementById('foot').textContent = current==='home' ? 'Your answers save in this browser only. Nothing is sent anywhere. Use \u201cSave as PDF\u201d on the summary to keep your copy.' : '';
    wire();
  }
  function wire(){
    app.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(){ persist(); go(b.getAttribute('data-go')); }); });
    var bk=app.querySelector('[data-back]'); if(bk) bk.addEventListener('click',function(){ persist(); back(); });
    app.querySelectorAll('[data-start]').forEach(function(c){ c.addEventListener('click',function(){ captureClient(); go(S.align.goal?'aWant':'aWant'); }); });
    app.querySelectorAll('[data-save]').forEach(function(b){ b.addEventListener('click',function(){ var f=b.getAttribute('data-save'); var g=document.getElementById('goal'); if(f==='goal'&&g){ S.align.goal=g.value.trim(); save(); } }); });
    app.querySelectorAll('[data-collect]').forEach(function(b){ b.addEventListener('click',function(){ collect(b.getAttribute('data-collect')); }); });
    app.querySelectorAll('[data-add]').forEach(function(b){ b.addEventListener('click',function(){ var fp=b.getAttribute('data-add').split(':'); collect(b.getAttribute('data-add')); S[fp[0]][fp[1]].push(''); save(); render(); }); });
    app.querySelectorAll('[data-rmv]').forEach(function(b){ b.addEventListener('click',function(){ var fp=b.getAttribute('data-rmv').split(':'),i=+b.getAttribute('data-idx'); collect(b.getAttribute('data-rmv')); S[fp[0]][fp[1]].splice(i,1); if(!S[fp[0]][fp[1]].length) S[fp[0]][fp[1]]=['']; save(); render(); }); });
    var bel=app.querySelector('[data-belief]'); if(bel) bel.addEventListener('click',function(){ history.push('aNotice'); startBeliefs(); });
    app.querySelectorAll('[data-confirm]').forEach(function(b){ b.addEventListener('click',function(){ var key=b.getAttribute('data-confirm'); var ta=app.querySelector('[data-chosen="'+cssesc(key)+'"]'); if(ta&&ta.value.trim()){ S.align.chosen[key]=ta.value.trim(); S.align.confirmed[key]=true; save(); render(); } else if(ta){ ta.focus(); ta.style.borderColor='var(--gold)'; } }); });
    var build=app.querySelector('[data-build]'); if(build) build.addEventListener('click',function(){ var f=document.getElementById('fa'); if(f) S.align.finalAnswer=f.value.trim(); app.querySelectorAll('[data-chosen]').forEach(function(t){ S.align.chosen[t.getAttribute('data-chosen')]=t.value.trim(); }); S.align.done=true; save(); go('summary'); });
    var rst=app.querySelector('[data-reset]'); if(rst) rst.addEventListener('click',function(){ if(confirm('Clear everything and start fresh?')){ S=blank(); save(); history=[]; go('home',true);} });
    var cdoc=app.querySelector('[data-copy-doc]'); if(cdoc) cdoc.addEventListener('click',function(){ copyText(exportDocText(),function(ok){ toast(ok?'Copied. Paste it into a Google Doc (Ctrl/Cmd+V).':'Could not copy \u2014 use the download button instead.',ok); }); });
    var ccode=app.querySelector('[data-copy-code]'); if(ccode) ccode.addEventListener('click',function(){ copyText('\u27e6BC\u27e7'+JSON.stringify(S)+'\u27e6/BC\u27e7',function(ok){ toast(ok?'Backup code copied. Keep it to re-import this session later.':'Could not copy \u2014 use the download button instead.',ok); }); });
    var dl=app.querySelector('[data-download]'); if(dl) dl.addEventListener('click',function(){ var nm=(S.client.name||'client').replace(/[^a-z0-9]+/gi,'-').toLowerCase(); var ok=downloadFile('alignment-'+nm+'.json', JSON.stringify(S,null,2),'application/json'); toast(ok?'Backup file downloaded.':'Download failed.',ok); });
    var lp=app.querySelector('[data-load-paste]'); if(lp) lp.addEventListener('click',function(){ var v=document.getElementById('pasteIn').value; var o=extractState(v); if(o){ loadState(o); } else { toast('Could not read that \u2014 paste the backup code or the exported doc text.',false); } });
    var fi=app.querySelector('#fileIn'); if(fi) fi.addEventListener('change',function(){ var f=fi.files&&fi.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ var o=extractState(r.result); if(o){ loadState(o); } else { toast('That file did not contain a session backup.',false); } }; r.readAsText(f); });
    var ce=app.querySelector('[data-edit="contact"]'); if(ce) ce.addEventListener('blur',function(){ S.contact=ce.textContent.trim(); save(); });
  }
  function captureClient(){ var c=document.getElementById('clientName'); if(c){ S.client.name=c.value.trim(); } if(!S.client.date) S.client.date=todayStr(); save(); }
  function persist(){
    var g=document.getElementById('goal'); if(g) S.align.goal=g.value.trim();
    var c=document.getElementById('clientName'); if(c) S.client.name=c.value.trim();
    var f=document.getElementById('fa'); if(f) S.align.finalAnswer=f.value.trim();
    app.querySelectorAll('[data-list]').forEach(function(t){ var a=t.getAttribute('data-list').split(':'); S[a[0]][a[1]][+t.getAttribute('data-idx')]=t.value; });
    app.querySelectorAll('[data-chosen]').forEach(function(t){ if(t.value.trim()) S.align.chosen[t.getAttribute('data-chosen')]=t.value.trim(); });
    save();
  }
  function collect(fp){ var a=fp.split(':'); app.querySelectorAll('[data-list="'+fp+'"]').forEach(function(t){ S[a[0]][a[1]][+t.getAttribute('data-idx')]=t.value; }); save(); }
  function cssesc(s){ return s.replace(/(["\\])/g,'\\$1'); }

  document.getElementById('homeBtn').onclick=function(){ persist(); go('home'); };
  document.getElementById('sumBtn').onclick=function(){ persist(); captureClient(); go('summary'); };
  if(!S.client.date) S.client.date=todayStr();
  render();
})();
</script>
</body>
</html>
